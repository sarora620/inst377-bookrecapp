<html>
    <head>
        <title>The Cozy Catalog</title>
        <link rel="stylesheet" href="stylesheet.css">
        <script src="home.js" defer></script>
    </head>
    <body> 
        <!-- NAV BAR -->
        <nav>
            <div class="nav-container">
                <a href="home.html" class="logo">The Cozy Catalog</a>
        
                  <a href="home.html" class="nav-link">Home</a>
                  <a href="about.html" class="nav-link">About</a>
            
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="main-container">
            <h1>Find Your Cozy Read</h1>
            <h2>Dewey ain't eva decimal like this</h2>
            
            <div class="search-container">
                <form id="book-form">
                    <!-- TOP SEARCH BAR -->
                    <div class="idle-search" id="idleSearch">
                        <input type="text" id="searchInput" placeholder="Search for a book...">
                    </div>

                    <!-- genre -->
                    <div class="option-group">
                        <select id="genreSelect">
                        <label>Genre</label>
                        <option value="">Choose a genre</option>
                        <!-- will be filled in by js-->
                        </select>
                    </div>

                    <!-- page count -->
                    <div class="option-group">

                        <div class="range-container">
                            <label>Number of Pages</label>
                            <span id="pagevalue"></span>
                            <span>50</span>
                            <input type="range" id="pageSlider" min="50" max="800" step="50" oninput="this.nextElementSibling.innerText = this.value">
                            <span>50</span> 
                        </div>

                    <button id="searchBtn" type="submit">Search</button> 
                </form>
                </div>
            </div>
        </div>
        

    </body>
</html>
