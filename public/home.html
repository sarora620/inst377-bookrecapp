<html>
    <head>
        <title>The Cozy Catalog</title>
        <link rel="stylesheet" href="stylesheet.css">
        <script src="home.js" defer></script>
    </head>
    <body> 
        <!-- NAV BAR -->
        <nav>
            <div class="nav-container">
                <a href="home.html" class="logo">The Cozy Catalog</a>
                <a href="home.html" class="nav-link active">Home</a>
                <a href="about.html" class="nav-link">About</a>
            
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="main-container">
            <h1>Find Your Cozy Read</h1>
            <h2>Dewey ain't eva decimal like this</h2>
            
            <div class="search-container">
                <form id="book-form" onsubmit="searchSubmit(event)">

                    <!-- genre -->
                    <div class="option-group">
                        <label for="genreSelect">Genre</label>
                        <select id="genreSelect">
                        <option value="">Choose a genre</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="romance">Romance</option>
                        <option value="mystery">Mystery</option>
                        <option value="dystopia">Dystopia</option>
                        <option value="science fiction">Science fiction</option>
                        <option value="thriller">Thriller</option>
                        <option value="young adult">Young Adult (YA)</option>
                        <option value="adventure">Adventure</option>
                        <option value="poetry">Poetry</option>
                        <option value="biography">Biography</option>
                        <option value="fiction">Fiction</option>
                        <option value="nonfiction">Nonfiction</option>
                        </select>
                    </div>

                    <!-- page count -->
                    <div class="option-group">
                        <label for="pageSlider">Maximum number of pages</label>
                        <div class="range-container">
                            <span>50</span>
                            <input type="range" id="pageSlider" min="50" max="800" step="50" value="100" oninput="document.getElementById('pageValue').innerText = this.value">
                            <span id="pageValue">100</span> 
                        </div>

                    <button id="searchBtn" type="submit">Search</button> 
                </form>
                </div>
            </div>

            <div id="queryResults">
                <h1 id="loading"></h1>
            </div>

            <div id="booksDisplay">
                <!-- filled with JS -->
                 <div id="pageCountBooks"></div>
                 <div id="genreBooks"></div>
            </div>
        </div>
        

    </body>
</html>
